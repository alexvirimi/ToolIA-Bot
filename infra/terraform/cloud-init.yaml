#cloud-config
package_update: true
packages:
  - git
  - curl
  - ca-certificates

write_files:
  - path: /opt/toolia-setup.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      exec >> /var/log/toolia-setup.log 2>&1
      echo "== inicio $(date)"

      curl -fsSL https://get.docker.com | sh
      usermod -aG docker ${admin_username}

      APP=/home/${admin_username}/ToolIA-Bot
      if [ ! -d "$APP" ]; then
        sudo -u ${admin_username} git clone ${repo_url} "$APP"
      fi
      sudo -u ${admin_username} mkdir -p "$APP/data/raw" "$APP/data/processed"

      echo "TOOLIA_DOMAIN=${domain}" > "$APP/deploy/bot/.env"
      echo "TOOLIA_RAG=${rag_modo}" >> "$APP/deploy/bot/.env"
      chown ${admin_username}: "$APP/deploy/bot/.env"

      cd "$APP"
      export COMPOSE_FILE=deploy/bot/compose.yaml
      docker compose up -d --wait ollama
      docker compose exec -T ollama ollama pull embeddinggemma:300m
      docker compose exec -T ollama ollama pull qwen3.5:9b
      echo "== SETUP_OK $(date)"

runcmd:
  - [bash, /opt/toolia-setup.sh]
