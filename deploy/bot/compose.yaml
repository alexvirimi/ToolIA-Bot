name: toolia-bot

services:
  ollama:
    image: ollama/ollama:0.40.18
    restart: unless-stopped
    volumes:
      - modelos:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  bot:
    profiles: ["cli"]
    build:
      context: ../..
      dockerfile: deploy/bot/Dockerfile
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      TOOLIA_INDICE: /var/lib/toolia/indice
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ../../data:/app/data:ro
      - indice:/var/lib/toolia

volumes:
  modelos:
  indice:
